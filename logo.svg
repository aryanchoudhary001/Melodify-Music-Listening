<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" width="250" height="60">
  <!-- Classic Green Circle Icon -->
  <g transform="translate(10, 10)">
    <!-- Main Circle -->
    <circle cx="20" cy="20" r="20" fill="#1ed760" />
    
    <!-- Sound Waves (Tilted slightly and colored black for contrast) -->
    <g fill="none" stroke="#000000" stroke-linecap="round" transform="rotate(-6 20 20)">
      <!-- Top Wave -->
      <path d="M 9.5 14 C 15 10 25 10 30.5 14" stroke-width="3.5" />
      <!-- Middle Wave -->
      <path d="M 11.5 21 C 16 17.5 24 17.5 28.5 21" stroke-width="3" />
      <!-- Bottom Wave -->
      <path d="M 14 27 C 17.5 24.5 22.5 24.5 26 27" stroke-width="2.5" />
    </g>
  </g>

  <!-- App Name in a similar bold, sans-serif font -->
  <text x="60" y="42" font-family="Circular, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="30" fill="white" letter-spacing="-1.2">Melodify</text>
</svg>
